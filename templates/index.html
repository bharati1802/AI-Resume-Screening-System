<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Screening System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 10px;
            color: #1f3c88;
        }

        .header p {
            color: #666;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .form-group {
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1f3c88;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fc;
            border-radius: 10px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            color: #1f3c88;
            margin: 15px 0;
        }

        .skills {
            margin-top: 15px;
        }

        .skill {
            display: inline-block;
            padding: 7px 12px;
            margin: 5px;
            border-radius: 20px;
            background: #e8eefc;
        }

        .error {
            color: #c62828;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>AI-Powered Resume Screening System</h1>

            <p>
                Analyze resumes using NLP, TF-IDF and Cosine Similarity
            </p>
        </div>

        <div class="card">

            <form id="resumeForm">

                <div class="form-group">

                    <label for="resume">
                        Upload Resume
                    </label>

                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf,.docx"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="job_description">
                        Job Description
                    </label>

                    <textarea
                        id="job_description"
                        name="job_description"
                        rows="12"
                        placeholder="Paste the Job Description here..."
                        required
                    ></textarea>

                </div>

                <button type="submit">
                    Analyze Resume
                </button>

            </form>

            <div id="result">

                <h2>Screening Result</h2>

                <p>
                    <strong>Resume:</strong>
                    <span id="filename"></span>
                </p>

                <div class="score">
                    <span id="score"></span>%
                </div>

                <h3>Matched Skills</h3>

                <div
                    id="matchedSkills"
                    class="skills"
                ></div>

                <h3>Missing Skills</h3>

                <div
                    id="missingSkills"
                    class="skills"
                ></div>

            </div>

        </div>

    </div>


    <script>

        const form = document.getElementById("resumeForm");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const formData = new FormData(form);

            const resultDiv = document.getElementById("result");

            resultDiv.style.display = "block";

            resultDiv.innerHTML = "<h2>Analyzing Resume...</h2>";

            try {

                const response = await fetch(
                    "/analyze",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    resultDiv.innerHTML =
                        `<p class="error">${data.error}</p>`;

                    return;
                }

                document.getElementById("filename").textContent =
                    data.resume_filename;

                document.getElementById("score").textContent =
                    data.matching_score;

                const matchedContainer =
                    document.getElementById("matchedSkills");

                const missingContainer =
                    document.getElementById("missingSkills");

                matchedContainer.innerHTML = "";

                missingContainer.innerHTML = "";

                data.matched_skills.forEach(function(skill) {

                    const span = document.createElement("span");

                    span.className = "skill";

                    span.textContent = skill;

                    matchedContainer.appendChild(span);

                });

                data.missing_skills.forEach(function(skill) {

                    const span = document.createElement("span");

                    span.className = "skill";

                    span.textContent = skill;

                    missingContainer.appendChild(span);

                });

            }

            catch (error) {

                resultDiv.innerHTML =
                    `<p class="error">
                        Something went wrong. Please try again.
                    </p>`;

            }

        });

    </script>

</body>

</html>
